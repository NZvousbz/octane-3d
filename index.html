<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Garage Rocket League</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1a1a1a;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .garage {
      position: relative;
      width: 400px;
      height: 200px;
      margin: 20px auto;
    }
    .garage img {
      position: absolute;
      width: 100%;
      height: auto;
    }
    .controls {
      margin-top: 20px;
    }
    select, input[type="color"] {
      margin: 10px;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>Simulateur de Garage Rocket League</h1>

  <div class="garage">
    <img id="car-base" src="https://via.placeholder.com/400x200?text=Voiture" alt="Car base">
    <img id="sticker" src="" alt="Sticker" style="display:none;">
  </div>

  <div class="controls">
    <label for="sticker-select">Sticker :</label>
    <select id="sticker-select">
      <option value="none">Aucun</option>
      <option value="https://via.placeholder.com/400x200/ff0000/ffffff?text=Sticker+1">Sticker 1</option>
      <option value="https://via.placeholder.com/400x200/00ff00/ffffff?text=Sticker+2">Sticker 2</option>
    </select>

    <label for="car-color">Couleur :</label>
    <input type="color" id="car-color" value="#ffffff">
  </div>

  <script>
    const stickerSelect = document.getElementById("sticker-select");
    const stickerImg = document.getElementById("sticker");
    const carBase = document.getElementById("car-base");
    const carColor = document.getElementById("car-color");

    stickerSelect.addEventListener("change", () => {
      const value = stickerSelect.value;
      if (value === "none") {
        stickerImg.style.display = "none";
      } else {
        stickerImg.src = value;
        stickerImg.style.display = "block";
      }
    });

    carColor.addEventListener("input", () => {
      carBase.style.filter = `brightness(0) saturate(100%) sepia(1) hue-rotate(0deg)`;
      carBase.style.backgroundColor = carColor.value;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Octane 3D Viewer</title>
    <style>
      body { margin: 0; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202020);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      scene.add(light);

      const loader = new GLTFLoader();
      loader.load('octane.glb', function (gltf) {
        scene.add(gltf.scene);
      }, undefined, function (error) {
        console.error(error);
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
